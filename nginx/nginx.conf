##############################################################################
# Nginx — Voice AI Platform (India Scale)
#
# Key design decisions:
#   - ip_hash sticky sessions: each caller's IP always routes to the same
#     backend instance, so in-memory CallSession state is always reachable
#   - WebSocket upgrade headers forwarded correctly
#   - Long timeouts for WebSocket connections (active calls can last 30 min)
#   - Rate limiting on REST API to protect against abuse
##############################################################################

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  server_tokens      off;

  # ── Logging ────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Rate limiting (REST API) ───────────────────────────────────────────────
  # 100 req/s per IP for API; WebSocket connections excluded
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

  # ── Upstream — backend instances ──────────────────────────────────────────
  upstream voice_backend {
    ip_hash;                        # sticky: same IP → same backend node

    server 127.0.0.1:3001;          # instance 1 (PM2 srv-1)
    server 127.0.0.1:3002;          # instance 2 (PM2 srv-2)
    # add more as you scale: server 127.0.0.1:3003;

    keepalive 64;
  }

  # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
  server {
    listen 80;
    server_name api.yourplatform.com;
    return 301 https://$host$request_uri;
  }

  # ── Main HTTPS server ──────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.yourplatform.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourplatform.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # ── WebSocket — Vobiz media streams ──────────────────────────────────────
    # Long timeout: active calls can last up to maxDurationMinutes (default 10)
    location ~ ^/ws/call/ {
      proxy_pass         http://voice_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_read_timeout  1800s;    # 30 min max call duration
      proxy_send_timeout  1800s;
      proxy_connect_timeout 10s;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=200 nodelay;

      proxy_pass         http://voice_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host             $host;
      proxy_set_header   X-Real-IP        $remote_addr;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      proxy_read_timeout  30s;
      proxy_send_timeout  30s;
      proxy_connect_timeout 5s;
    }

    # ── Health check (no rate limit, no logging) ──────────────────────────────
    location /health {
      access_log off;
      proxy_pass http://voice_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
