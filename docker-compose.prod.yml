##############################################################################
# docker-compose.prod.yml — Voice AI Platform (India Production)
#
# Services:
#   nginx       — reverse proxy, ip_hash sticky sessions for WebSocket
#   api-1       — backend instance 1 (srv-1, port 3001)
#   api-2       — backend instance 2 (srv-2, port 3002)
#   redis       — optional local Redis (replace with Upstash in production)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml up -d --scale api=4  (future)
##############################################################################

version: '3.9'

networks:
  voice_net:
    driver: bridge

volumes:
  nginx_logs:
  api_logs:

services:

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # certbot certs
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-1
      - api-2
    networks:
      - voice_net

  # ── Backend instance 1 ────────────────────────────────────────────────────
  api-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVER_ID: srv-1
    env_file:
      - ./backend/.env
    volumes:
      - api_logs:/app/logs
    networks:
      - voice_net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Backend instance 2 ────────────────────────────────────────────────────
  api-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      SERVER_ID: srv-2
    env_file:
      - ./backend/.env
    volumes:
      - api_logs:/app/logs
    networks:
      - voice_net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3002/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Local Redis (dev/staging only) ────────────────────────────────────────
  # In production, use Upstash Redis (Mumbai region) for managed, serverless Redis.
  # Comment this out and set REDIS_URL=rediss://... in .env for Upstash.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    expose:
      - '6379'
    networks:
      - voice_net
